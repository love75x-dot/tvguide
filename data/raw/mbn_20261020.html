	if (mbn_m_url.length > 0) {
        mbnDomainCheck();

		function jsonp(uri) {
 	    return new Promise(function(resolve, reject) {
 	        var id = '_' + Math.round(10000 * Math.random());
 	        var callbackName = 'jsonp_callback_' + id;
 	        window[callbackName] = function(data) {
 	            delete window[callbackName];
 	            var ele = document.getElementById(id);
 	            ele.parentNode.removeChild(ele);
 	            resolve(data);
 	        }

 	        var src = uri + '&callback=' + callbackName;
 	        var script = document.createElement('script');
 	        script.src = src;
 	        script.id = id;
 	        script.addEventListener('error', reject);
 	        (document.getElementsByTagName('head')[0] || document.body || document.documentElement).appendChild(script)
 	    });
 	}	
    	
    
function mbnDomainCheck(){
	if (window.location.href.indexOf("mbn.mk.co.kr") != -1){
	    var url = '//www.mbn.co.kr/process/agent_cookieCheck.php?callback=?';	    jsonp(url).then(function(data){
			
	    	if(data.cookie == "Y") {
	    		
				//console.log('json cookie : Y');
				setCookie('mbnPcVersionBrowserMove', 'Y');
				//모바일 이동 버튼 추가
				if(mobileChk() == "M"){
					
					setTimeout(function() {
						mobileMoveBtn();
					}, 500);
				}
			} else {
				//console.log('cookie : 없거나 N  || 값: '+data.cookie);
				deleteCookie('mbnPcVersionBrowserMove');
				if(mobileChk()!=false){
				                        if (new URLSearchParams(location.search).get('uagent') == 'm') {
                        //console.log(new URLSearchParams(location.search).get('uagent'));
                    } else {
                        location.href = mbn_m_url;
                    }
					// location.href=mbn_m_url;
				}
			}
	    	
    	}); 

	   
			}else{
		//모바일 이동 버튼 추가
		if(mobileChk()!=false){
			mobileMoveBtn();
		}
		//모바일 이동
		mbnAgentMove();
	}
}

function mbnAgentMove(){
	//console.log("check : "+mobileChk());
	if( mobileChk() == true ) { //모바일이고 mbn 캐시가 Y가 아니라면(chk == true) 모바일로 돌려보냄
                if (new URLSearchParams(location.search).get('uagent') == 'm') {
            //console.log(new URLSearchParams(location.search).get('uagent'));
        } else {
            location.href = mbn_m_url;
        }
		// location.href=mbn_m_url;
    }else if(mobileChk() != "M"){
		//캐시 반영이 되었을 경우를 대비하여 삭제 
    	$("#mobileChk").remove();
    }
}

function mobileMoveBtn(){
	var img_node = document.createElement("img");
	img_node.setAttribute('src', '//www.mbn.co.kr/images/btn_mobile.gif');	
	img_node.setAttribute('style', 'padding-bottom: 20px; padding-right: 330px;');

	var a_node = document.createElement("a");
	a_node.setAttribute('href', 'javascript:void(0);');
	a_node.setAttribute('style', 'float: right;');
	a_node.setAttribute('onclick', 'goMobile()');
	a_node.setAttribute('id', 'mbnMoveImg');
	
	a_node.appendChild(img_node);

	try{
		setTimeout(function() {
			document.getElementById("mbnPcVer").appendChild(a_node);
		}, 500);
	}catch(e){
		document.getElementById("footer_newsmain").appendChild(a_node);
	}
}
	
function goMobile(){
	if (window.location.href.indexOf("mbn.mk.co.kr") != -1){

		deleteCookie("mbnPcVersionBrowserMove");
		var url = '//www.mbn.co.kr/process/agent_cookieDelete.php?url='+mbn_m_url;	    location.href=url;

	}else{
		deleteCookie("mbnPcVersionBrowserMove");
		document.location.replace(mbn_m_url);
	}
	
	//deleteCookie("mbnPcVersionBrowserMove");
	//document.location.replace(mbn_m_url);
}

/*
 * vod/index 에서 url 분기되어서 변경
 */
function moveUrlCheck(){
	var c_url = "";
	var str_href = window.location.href;
	var str_index = str_href.indexOf("culture");

	if(str_href.indexOf("culture") != -1){
		var strUrlArr = str_href.split('?');
		c_url = strUrlArr[0] + "?culture";

	}else if(str_href.indexOf("drama") != -1){
		var strUrlArr = str_href.split('?');
		c_url = strUrlArr[0] + "?drama";
		
		
	}else if(str_href.indexOf("enter") != -1){
		var strUrlArr = str_href.split('?');
		c_url = strUrlArr[0] + "?enter";
		
	}
	//uagent=m 없애기 위해 ...
	history.pushState(null, null, c_url);
}
