name: 편성표·연예이슈 업데이트

on:
  schedule:
    - cron: "7 * * * *"   # 예비용 (주 실행은 Cloudflare 봇이 매시 7분에 시작)
  workflow_dispatch:
    inputs:
      digest_test:
        description: "편성표 발송 테스트 (8 또는 19 입력, 비우면 평소대로)"
        required: false
      recipe_test:
        description: "레시피 알림 테스트 (1 입력)"
        required: false
      news_test:
        description: "드라마 이슈 알림 테스트 (1 입력 시 최근 드라마 기사 5건 발송)"
        required: false

permissions:
  contents: write

concurrency:
  group: tvguide-update
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scraper/fetch.py
      - name: 연예 이슈 수집 + 알림
        run: python scraper/news.py
        env:
          NEWS_TEST: ${{ github.event.inputs.news_test }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      - name: 오늘의 소재 (연예 랭킹·시청률·경기·키워드)
        run: python scraper/trends.py
        env:
          NAVER_AD_API_KEY: ${{ secrets.NAVER_AD_API_KEY }}
          NAVER_AD_SECRET: ${{ secrets.NAVER_AD_SECRET }}
          NAVER_AD_CUSTOMER_ID: ${{ secrets.NAVER_AD_CUSTOMER_ID }}
          NAVER_HUB_ID: ${{ secrets.NAVER_HUB_ID }}
          NAVER_HUB_SECRET: ${{ secrets.NAVER_HUB_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
          RECIPE_TEST: ${{ github.event.inputs.recipe_test }}
      - name: 편성표 텔레그램 발송 (08시·19시)
        run: python scraper/digest.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
          DIGEST_FORCE: ${{ github.event.inputs.digest_test }}
      - name: 변경사항 저장
        run: |
          git config user.name "tvguide-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "편성표 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git pull --rebase -X ours || true
          git push
